name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            uv-artifact: uv-x86_64-unknown-linux-gnu.tar.gz
            uv-checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          - os: ubuntu-latest
            python: "3.14"
            uv-artifact: uv-x86_64-unknown-linux-gnu.tar.gz
            uv-checksum: 68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2
          - os: macos-latest
            python: "3.14"
            uv-artifact: uv-aarch64-apple-darwin.tar.gz
            uv-checksum: 5bb0e5fe008a773c3dbcb97ff79cd89e1241464fe9d2f986d52ad8f1b037bd62
          - os: windows-latest
            python: "3.14"
            uv-artifact: uv-x86_64-pc-windows-msvc.zip
            uv-checksum: 4c4d49d8738847d9b71ba319e49a5688c93eac0fe6204b1df24e98528dddf39a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        name: Verify and install ${{ matrix.uv-artifact }}
        env:
          # setup-uv skips archive verification on a tool-cache hit.
          # setup-uv 命中工具缓存时会跳过归档校验。
          RUNNER_TOOL_CACHE: ${{ runner.temp }}/astrology-uv-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          version: "0.12.5"
          # Digests cover the named archives from astral-sh/uv release 0.12.5.
          # 摘要对应 astral-sh/uv 0.12.5 发布中上面具名的归档。
          checksum: ${{ matrix.uv-checksum }}
          enable-cache: false
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked python tools/check.py
